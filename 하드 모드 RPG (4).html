<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="shade" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="4.5" diffuseConstant="1.18" lighting-color="#fff" result="diff"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>

 <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>

</filter></defs></svg>
<title>하드 모드 RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 한 열 콘솔. 위에서부터 HUD → 스테이지(배경 + 두 전사 + 이펙트) → 행동 버튼 → 로그.
   밤하늘 단일 테마로 의도적으로 고정한다. */
:root {
  --bg: #100e1b;
  --surface: #1b1830;
  --surface-2: #272243;
  --line: #3a3463;
  --fg: #ece6d6;
  --muted: #a49dc2;
  --ember: #f0a43a;
  --ember-ink: #2a1a04;
  --blood: #e0533f;
  --hp: #5ec58a;
  --mana: #5aa7f0;
  --rage: #e0533f;
  --shield: #c3cde8;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 18px 40px; }
#app { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.screen { display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .pick:focus-within, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.y-blade { opacity: 0; transition: opacity .06s; } .y-hilt { transition: opacity .06s; } .drawn .y-blade { opacity: 1; } .drawn .y-hilt { opacity: 0; }
.o { stroke: #0d0a16; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.art { display: block; width: 100%; height: auto; overflow: visible; filter: url(#shade) drop-shadow(0 5px 5px rgba(0,0,0,.38)); }

/* ---------- 아트 대기 모션 ---------- */
.bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 100px 206px; }
@keyframes bob { 50% { transform: translateY(-3px) scaleY(1.018); } }
.sway { animation: sway 3.2s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(-4deg) skewX(2deg); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.2); opacity: .65; } }
.slimeb { animation: squish 1.8s ease-in-out infinite; transform-origin: 100px 206px; }
@keyframes squish { 0%, 100% { transform: scale(1.04, .95); } 50% { transform: scale(.96, 1.06); } }
.wing { animation: flap 2.2s ease-in-out infinite; }
@keyframes flap { 50% { transform: rotate(-13deg); } }
.tail { animation: tailw 3s ease-in-out infinite; }
@keyframes tailw { 50% { transform: rotate(5deg); } }
.halo { animation: halo 3s ease-in-out infinite; filter: drop-shadow(0 0 4px #ffe27a); }
@keyframes halo { 50% { transform: translateY(-4px); } }
.blink { animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .bob, .sway, .pulse, .slimeb, .wing, .tail, .halo, .blink { animation: none; } }

/* ---------- 공통 패널 ---------- */
.eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; color: var(--ember); font-weight: 700; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 8vw, 54px); line-height: 1.1; text-wrap: balance; text-shadow: 0 2px 0 #000, 0 0 30px rgba(240,164,58,.45); }
h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; text-wrap: balance; }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 54ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.panel > h3 { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
input[type=text] { background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 16px; width: 100%; }
.btn { background: var(--ember); color: var(--ember-ink); border: 0; border-radius: 10px; padding: 13px 24px; font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 #a86a14; transition: transform .1s, box-shadow .1s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a14; }

/* ---------- 타이틀 아트 ---------- */
.title-art { position: relative; height: clamp(250px, 50vw, 340px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); isolation: isolate; }
.title-art .bg { position: absolute; inset: 0; }
.title-art h1 { font-size: clamp(30px, 6.6vw, 46px); }
.title-art .tt { position: absolute; left: 18px; right: 18px; top: 16px; z-index: 4; }
.title-art .ttl-dragon { position: absolute; right: -4%; bottom: 10%; width: 62%; z-index: 1; opacity: .9; }
.title-art .cast { position: absolute; left: 3%; right: 3%; bottom: 7%; z-index: 3; display: flex; gap: 1%; align-items: flex-end; }
.title-art .cast > div { width: 13.2%; }
.title-art .tt .lead { text-shadow: 0 1px 6px #000; color: #d7d0ee; }

/* ---------- 선택 카드 ---------- */
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pick { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-width: 0; text-align: left; }
.pick input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.pick:has(input:checked) { border-color: var(--ember); background: #2a2140; box-shadow: inset 0 0 0 1px var(--ember), 0 0 20px rgba(240,164,58,.18); }
.pick b { font-size: 16px; }
.pick .stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pick .desc { font-size: 13px; opacity: .85; }
.pick .pv { height: 96px; display: flex; justify-content: center; margin-bottom: 4px; }
.pick .pv svg { height: 100%; width: auto; }
.pick .gi { display: flex; align-items: center; gap: 10px; }
.ico { width: 40px; height: 40px; flex: none; }
.legend { background: linear-gradient(180deg, #2d2242, #1c1630); border-color: #7a5a22; animation: glow 2.2s ease-in-out infinite; }
.legend:hover { border-color: var(--ember); transform: translateY(-2px); }
@keyframes glow { 50% { box-shadow: 0 0 22px rgba(240,164,58,.35); } }

/* ---------- HUD ---------- */
.hud { display: flex; flex-direction: column; gap: 8px; }
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.hud-row b { color: var(--fg); font-variant-numeric: tabular-nums; }
.hud-right { display: flex; gap: 10px; align-items: center; }
.mute { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.track { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.pip { height: 24px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pip.boss { border-color: #6b4a2a; color: var(--ember); }
.pip.final { border-color: var(--blood); color: var(--blood); }
.pip.done { background: #2d3a3a; color: var(--hp); border-color: #3c5a4c; }
.pip.now { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); font-weight: 700; box-shadow: 0 0 12px rgba(240,164,58,.6); }
.pip.now.final { background: var(--blood); color: #fff; border-color: var(--blood); box-shadow: 0 0 12px rgba(224,83,63,.7); }

/* ---------- 스테이지 ---------- */
.stage { --s: clamp(112px, 25vw, 196px); position: relative; height: clamp(350px, 64vw, 480px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #0d0b16; isolation: isolate; user-select: none; }
.stage-in { position: absolute; inset: 0; }
.bg { position: absolute; inset: 0; overflow: hidden; }
.bg .sky { position: absolute; inset: 0; }
.bg .cel { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
.bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg .layer { transition: transform 0s; }
.fog { position: absolute; left: -25%; right: -25%; bottom: 12%; height: 30%; background: radial-gradient(closest-side, rgba(255,255,255,.12), transparent); animation: fog 16s ease-in-out infinite alternate; pointer-events: none; }
.fog.f2 { bottom: 4%; height: 22%; animation-duration: 23s; animation-direction: alternate-reverse; opacity: .8; }
@keyframes fog { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
.lava { animation: lava 2.4s ease-in-out infinite; }
@keyframes lava { 50% { opacity: .65; } }
.vignette { position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 42%, transparent 52%, rgba(0,0,0,.6)); pointer-events: none; z-index: 4; }
.fighter { position: absolute; bottom: 13%; width: var(--s); z-index: 3; }
.fighter.p { left: 6%; }
.fighter.m { right: 6%; }
.fighter.m.boss { width: calc(var(--s) * 1.22); }
.fighter.m.dragon { width: calc(var(--s) * 2); right: 0; }
.fighter .mover, .fighter .flasher { will-change: transform; }
.fighter.m .art { transform: scaleX(-1); }
.fighter.m .art, .title-art .ttl-dragon .art { filter: drop-shadow(0 5px 5px rgba(0,0,0,.38)) saturate(1.1) contrast(1.06); }
.fighter .aura { position: absolute; left: 50%; top: 52%; width: 150%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: screen; }
.fighter .bubble { position: absolute; left: 50%; top: 52%; width: 125%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid rgba(190,215,255,.9); background: radial-gradient(circle, rgba(150,190,255,.05) 40%, rgba(150,190,255,.35)); box-shadow: 0 0 24px rgba(150,190,255,.7), inset 0 0 28px rgba(150,190,255,.5); animation: bub 2s ease-in-out infinite; pointer-events: none; }
@keyframes bub { 50% { transform: translate(-50%, -50%) scale(1.04); opacity: .8; } }
canvas.cv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
.fxl { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.fnum { position: absolute; font-family: var(--font-display); font-size: 28px; color: #fff; white-space: nowrap; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 14px rgba(0,0,0,.6); animation: fnum 1s cubic-bezier(.2,.8,.3,1) forwards; }
.fnum.dmg { color: #ffd9d2; }
.fnum.big { font-size: 46px; color: #ffb347; }
.fnum.heal { color: #7dffb0; }
.fnum.absorb { color: #bcd0ff; }
.fnum.lvl { color: #ffe27a; font-size: 34px; }
@keyframes fnum { 0% { transform: translate(-50%, -30%) scale(.4); opacity: 0; } 14% { transform: translate(-50%, -80%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -230%) scale(1); opacity: 0; } }
.slash { position: absolute; pointer-events: none; overflow: visible; }
.ring { position: absolute; border-radius: 50%; border: 4px solid #fff; transform: translate(-50%, -50%); pointer-events: none; }
.pillar { position: absolute; top: 0; bottom: 0; transform: translateX(-50%); pointer-events: none; mix-blend-mode: screen; }
.flash { position: absolute; inset: 0; z-index: 9; opacity: 0; pointer-events: none; }
.plate { position: absolute; top: 10px; z-index: 6; width: min(47%, 280px); background: rgba(10,8,20,.74); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.plate.p { left: 10px; }
.plate.m { right: 10px; }
.plate.m.boss { border-color: rgba(224,83,63,.7); box-shadow: 0 0 18px rgba(224,83,63,.3); }
.plate .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.plate .nm b { font-size: 14px; overflow-wrap: anywhere; line-height: 1.25; }
.plate .nm span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.bar { position: relative; height: 13px; border-radius: 7px; background: #05040b; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
.bar.thin { height: 13px; }
.bar.xs { height: 5px; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .3s ease; }
.bar .ghost { background: #f1e6a8; transition: width .8s ease .35s; opacity: .85; }
.bar .hp { background: linear-gradient(#7bdca3, #3da872); }
.bar.low .hp { background: linear-gradient(#ff8070, #d23a2a); }
.bar .rs.mana { background: linear-gradient(#7ec0ff, #3a82d8); }
.bar .rs.rage { background: linear-gradient(#ff8a70, #d6402e); }
.bar .sh { background: linear-gradient(#e3ecff, #9fb4e0); }
.bar .xp { background: linear-gradient(#ffe27a, #e0a82a); }
.bar .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; font-variant-numeric: tabular-nums; letter-spacing: .02em; z-index: 2; }
.plate .stat { display: flex; gap: 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.plate .warn { font-size: 11px; color: #ff8a70; font-weight: 700; min-height: 15px; }
.pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 3px 12px; border-radius: 999px; background: rgba(10,8,20,.7); border: 1px solid rgba(255,255,255,.15); color: var(--muted); white-space: nowrap; }
.pill.me { color: var(--ember); border-color: rgba(240,164,58,.55); }
.pill.en { color: #ff8a70; border-color: rgba(224,83,63,.55); }
@media (max-width: 560px) { .pill { top: auto; bottom: 62px; } }
.banner { position: absolute; left: 0; right: 0; top: 34%; z-index: 8; text-align: center; font-family: var(--font-display); font-size: clamp(30px, 8vw, 62px); letter-spacing: .04em; pointer-events: none; opacity: 0; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.9), 0 0 36px currentColor; line-height: 1.1; }
.banner small { display: block; font-family: var(--font-body); font-size: .3em; letter-spacing: .3em; font-weight: 700; margin-top: 6px; opacity: .9; }
.banner.show { animation: banner 1.7s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translateX(-70px) scale(1.15); } 18% { opacity: 1; transform: none; } 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(70px); } }
.caption { position: absolute; left: 12px; right: 12px; bottom: 9px; z-index: 6; text-align: center; font-size: 13px; background: rgba(10,8,20,.64); border-radius: 8px; padding: 5px 10px; min-height: 29px; overflow-wrap: anywhere; }

/* ---------- 행동 ---------- */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 560px) { .actions { grid-template-columns: 1fr 1fr; } }
.abtn { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 9px; display: flex; flex-direction: column; gap: 1px; align-items: center; text-align: center; min-width: 0; box-shadow: 0 3px 0 #0b0916; transition: transform .08s, border-color .15s; }
.abtn .bi { width: 22px; height: 22px; margin-bottom: 2px; color: var(--muted); }
.abtn b { font-size: 14px; line-height: 1.25; }
.abtn small { font-size: 11px; color: var(--muted); }
.abtn kbd { position: absolute; top: 5px; right: 7px; font: 10px var(--font-body); color: var(--muted); opacity: .6; }
.abtn:hover:not(:disabled) { border-color: var(--ember); transform: translateY(-1px); }
.abtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.abtn:hover:not(:disabled) .bi { color: var(--ember); }
.abtn.ult:not(:disabled) { border-color: var(--ember); animation: ult 1.5s ease-in-out infinite; }
.abtn.ult:not(:disabled) .bi { color: var(--ember); }
@keyframes ult { 50% { box-shadow: 0 3px 0 #0b0916, 0 0 18px rgba(240,164,58,.55); } }
.abtn:disabled { opacity: .38; cursor: not-allowed; }
.next { display: flex; justify-content: center; }
.log { background: #0b0914; border: 1px solid var(--line); border-radius: 10px; height: 170px; overflow-y: auto; padding: 10px 14px; font-size: 13px; }
.log p { margin: 0 0 3px; overflow-wrap: anywhere; }
.log .act { color: var(--fg); margin-top: 7px; }
.log .dmg { color: #e8a79b; padding-left: 1.2em; }
.log .good { color: var(--hp); }
.log .lvl { color: var(--ember); font-weight: 700; }
.log .sys { color: var(--muted); }
.log .bad { color: var(--blood); font-weight: 700; }
.log .div { border-top: 1px dashed var(--line); margin: 9px 0 5px; padding-top: 7px; color: var(--ember); font-weight: 700; }

/* ---------- 보상 / 결과 ---------- */
.reward-stage { position: relative; height: 150px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); display: grid; place-items: center; background: radial-gradient(circle at 50% 120%, #4a3512, #17121f 70%); }
.reward-stage .art { height: 130px; width: auto; }
.result-art { position: relative; height: 190px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); display: grid; place-items: end center; padding-bottom: 14px; isolation: isolate; }
.result-art .bg { position: absolute; inset: 0; z-index: -1; }
.result-art .art { height: 150px; width: auto; }
.result-art.lose .art { filter: grayscale(1) brightness(.55); transform: rotate(84deg) translate(-8px, 10px); transform-origin: 50% 100%; }
.result-title { font-family: var(--font-display); font-size: clamp(30px, 7vw, 46px); line-height: 1.15; margin: 0; text-wrap: balance; }
.result-title.win { color: var(--ember); text-shadow: 0 0 28px rgba(240,164,58,.5); }
.result-title.lose { color: var(--blood); }
dl.stats-list { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-variant-numeric: tabular-nums; }
dl.stats-list dt { color: var(--muted); }
dl.stats-list dd { margin: 0; overflow-wrap: anywhere; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.title-art .ttl-dragon .art{transform:scaleX(-1)}

</style>
<div id="app">

  <section id="screen-setup" class="screen">
    <div class="title-art" id="title-art">
      <div class="bg" id="title-bg"></div>
      <div class="ttl-dragon" id="title-dragon"></div>
      <div class="tt">
        <p class="eyebrow">12번의 전투 · 하드 모드</p>
        <h1>최후의 라이벌을<br>쓰러뜨려라</h1>
      </div>
      <div class="cast" id="title-cast"></div>
    </div>
    <p class="lead" style="margin:0">슬라임부터 오크 대장군까지 열두 번 싸우고, 마지막 전투에서는 선택한 직업의 라이벌과 맞붙는다. 3, 6, 9, 12번째 전투 전에는 전설 장비를 하나 고를 수 있다.</p>

    <div class="panel">
      <h3>1. 이름과 직업</h3>
      <label class="field" for="name">플레이어 이름
        <input id="name" type="text" maxlength="12" placeholder="용사" autocomplete="off">
      </label>
      <div class="picks" id="jobs"></div>
    </div>

    <div class="panel">
      <h3>2. 스타팅 장비</h3>
      <div class="picks" id="gear-start"></div>
      <div><button class="btn" id="btn-start" type="button">모험 시작</button></div>
    </div>
  </section>

  <section id="hud" class="hud" hidden>

    for (let x = W - 110; x < W + 20; x += 40) near += stal(x, GY + 40, 150 + R() * 100, 60, th.near);
  }
  let stars = "";
  for (let i = 0; i < th.stars; i++) stars += `<circle cx="${R() * W}" cy="${R() * 200}" r="${0.6 + R() * 1.3}" fill="#fff" opacity="${0.3 + R() * 0.6}"/>`;
  const ground = `<path d="M0 ${GY} Q190 ${GY - 10} 380 ${GY - 2} T${W} ${GY - 6} V${H} H0Z" fill="${th.ground}"/><path d="M0 ${GY} Q190 ${GY - 10} 380 ${GY - 2} T${W} ${GY - 6}" stroke="${th.edge}" stroke-width="2" fill="none" opacity=".55"/>`;
  const lava = th.lava ? `<g class="lava"><rect x="0" y="${GY + 34}" width="${W}" height="10" fill="#ff5a1f" opacity=".5"/><rect x="0" y="${GY + 30}" width="${W}" height="18" fill="#ff7a2a" opacity=".16"/></g>` : "";
  return `<div class="sky" style="background:linear-gradient(${th.top},${th.bot})"></div>
<div class="cel" style="left:${th.cx * 100}%;top:${th.cy * 100}%;width:${th.cr * 2}px;height:${th.cr * 2}px;background:${th.cel};box-shadow:0 0 ${th.cr * 2}px ${th.cr * 0.8}px ${th.glow}"></div>
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">${stars}${far}${mid}${ground}${lava}${near}</svg>`;
}

/* ---------- 이벤트 큐: 로직은 즉시 계산하고 연출은 순서대로 재생 ---------- */
const Q = [];
const log = (text, cls) => Q.push({ t: "log", text, cls });
let totalCount = 0, monsterCount = 0;

/* ---------- 캐릭터 클래스 (Python 원본 로직) ---------- */
const GROWTH = {
  archmage: { hp: 32, atk: 8, def: 4 },
  warrior: { hp: 40, atk: 7, def: 5 },
  wizard: { hp: 30, atk: 9, def: 3 },
  healer: { hp: 35, atk: 6, def: 4 },
  darkwizard: { hp: 30, atk: 9, def: 3 },
  hero: { hp: 35, atk: 8, def: 5 },
  yeon: { hp: 200, atk: 100, def: 100 },
};
class Character {
  constructor(name, hp, atk, def) {
    this.name = name; this.maxHp = hp; this._hp = hp; this.atk = atk; this.def = def; this.exp = 0; this.level = 1;
    totalCount++;
  }
  get hp() { return this._hp; }
  set hp(v) { this._hp = Math.max(0, Math.min(this.maxHp, v)); }
  get alive() { return this._hp > 0; }
  static calcDamage(a, d) { return Math.max(1, a - d); }
  takeDamage(dmg, o) {
    const actual = Character.calcDamage(dmg, this.def);
    this.hp -= actual;
    log(`${this.name}이(가) ${actual}의 데미지를 받았다! (남은 HP: ${this.hp})`, "dmg");
    Q.push({ t: "dmg", who: this, amount: actual, hp: this.hp, big: !!(o && o.big) });
    return actual;
  }
  heal(n) {
    const b = this.hp; this.hp += n;
    Q.push({ t: "heal", who: this, amount: this.hp - b, hp: this.hp });
  }
  attack(o) {
    log(`⚔️ ${this.name}이(가) ${o.name}을(를) 공격!`, "act");
    o.takeDamage(this.atk);
  }
  refill() {
    this._hp = this.maxHp;
    if ("mana" in this) this.mana = this.resource().max;
    if ("spirit" in this) this.spirit = 60;
    if ("rage" in this) this.rage = 0;
    if ("ward" in this) this.ward = 0;
    if ("horcrux" in this) this.horcrux = true;
  }
  gainExp(n) {
    this.exp += n;
    log(`${this.name}이(가) 경험치 ${n}를 획득! (총 경험치: ${this.exp})`, "good");
    while (this.exp >= this.level * 100) this.levelUp();
  }
  levelUp() {
    const g = GROWTH[this.key] || { hp: 20, atk: 5, def: 3 };
    this.level++; this.maxHp += g.hp; this._hp = this.maxHp; this.atk += g.atk; this.def += g.def;
    log(`🎉 레벨 업! ${this.name} → Lv.${this.level}! (HP +${g.hp}, 공격 +${g.atk}, 방어 +${g.def})`, "lvl");
    Q.push({ t: "level", who: this });
  }
}

async function rivalTurn(m, apply) {
  const mv = m.nextMove(), R = m.R, col = R.col, sword = !!R.sword; m.curMove = mv; m.t++;
  const pl = () => pt("p", 0.5, 0.5);
  if (mv === "ult") { const a0 = apply; apply = () => { ultImpact(col); a0(); }; await cutIn(R.ul, `${m.name} · 궁극기`, col); }
  const slash = (size, extra) => () => { const t = target("m"); slashFx(t.x, t.y, { color: col, size, flip: true, angle: 20 }); if (extra) slashFx(t.x, t.y, { color: "#fff", size: size - 40, flip: true, angle: -30 }); sfx.slash(); if (extra) shake(10, 300); };
  if (mv === "atk") {
    if (sword) await melee("m", { sw: "chop", trail: col, dash: 150, back: 20, overlap: 0.22, apply, fx: slash(170) });
    else {
      await weaponTo("m", SW.cast.wind, 160); sfx.magic();
      const from = pt("m", 0.16, 0.33), to = pl();
      await Promise.all([travel(from, to, 320, col, 10), weaponTo("m", SW.cast.hit, 220)]);
      burst(to.x, to.y, { n: 20, color: [col, "#fff"], speed: 4, life: 420 });
      apply(); await flush(); await weaponBase("m", 200);
    }
    return;
  }
  if (mv === "sp") {
    if (sword) { aura("m", col, 600); await melee("m", { sw: "chop", trail: col, dash: 150, back: 24, overlap: 0.22, apply, fx: slash(230, true) }); }
    else {
      const from = pt("m", 0.16, 0.33); await weaponTo("m", SW.cast.wind, 200); sfx.magic();
      await charge(from, col, 480); const to = pl(); sfx.fire();
      const sp = stream(from, to, 460, [col, "#fff"]);
      await weaponTo("m", SW.cast.hit, 240); await wait(260);
      burst(to.x, to.y, { n: 60, color: [col, "#fff"], speed: 8, size: 5, life: 640 });
      ringFx(to.x, to.y, col, 200, 580); flash(col, 0.4, 380); shake(11, 380); sfx.boom();
      apply(); await flush(); await sp; await weaponBase("m", 220);
    }
    return;
  }
  aura("m", col, 900); sfx.roar(); const to = pl(), from = pt("m", 0.16, 0.33);
  if (m.key === "hero") {
    const hb = holyBlade(to.x, to.y); await wait(430);
    pillarFx(to.x, col, 800, 150); burst(to.x, to.y, { n: 90, color: [col, "#fff", "#7ab8ff"], speed: 9, size: 5, life: 800 });
    flash("#fff", 0.85, 480); shake(20, 500); sfx.boom(); apply(); await flush(); await hb;
  } else if (m.key === "yeon") {
    boltFx(to.x, to.y, { thin: true }); await wait(320); boltFx(to.x, to.y);
    burst(to.x, to.y, { n: 100, color: ["#fff", "#a8e4ff", "#ffe66a"], speed: 10, size: 5, life: 800 });
    flash("#fff", 0.9, 360); shake(22, 600); sfx.boom(); apply(); await flush();
  } else if (m.key === "archmage") {
    flash("#1a0202", 0.55, 1000); await charge(from, "#ff3a3a", 520); sfx.fire();
    const bm = beamFx(from, to, "#ff3a3a", 760); await wait(280);
    burst(to.x, to.y, { n: 110, color: ["#ff3a3a", "#ff9a9a", "#fff"], speed: 11, size: 5, life: 820 });
    ringFx(to.x, to.y, "#ff3a3a", 250, 660); flash("#fff", 0.85, 440); shake(24, 640); sfx.boom(); apply(); await flush(); await bm;
  } else if (m.key === "wizard") {
    await wait(500); explosionFx(to.x, to.y); flash("#fff", 0.9, 400); shake(24, 700); sfx.boom(); apply(); await flush();

  { k: "archmage", n: "대마법사", s: "HP 130 · 공격 34 · 방어 12", d: "마나 120의 지혜로운 대마법사. 불꽃의 채찍은 ×3.4와 불꽃 장막, 궁극기 엑스펠리아르무스는 방어를 완전히 무시하는 ×14 일격과 적의 공격력을 절반으로 깎는 무장 해제." },
  { k: "yeon", n: "이연 (구미호 신)", s: "HP 10000 · 공격 10000 · 방어 10000", d: "세계관 최강자. 발도 일격으로 신력을 모아 여우구슬을 터뜨리고, 신력이 가득 차면 번개를 검에 받아 불꽃을 두르고 베어버린다." },
  { k: "hero", n: "영웅", s: "HP 200 · 공격 80 · 방어 60", d: "좋은 기본 스탯. 공격할 때마다 마나가 15 회복된다." },
];
function buildSetup() {
  $("#jobs").innerHTML = JOBS.map((j, i) => `<label class="pick"><input type="radio" name="job" value="${j.k}"${i === 0 ? " checked" : ""}><div class="pv">${ART[j.k]()}</div><b>${j.n}</b><span class="stats">${j.s}</span><span class="desc">${j.d}</span></label>`).join("");
  $("#gear-start").innerHTML = [
    ["1", ICON.sword, "강철 롱소드", "공격력 +8"], ["2", ICON.armor, "견고한 판금 갑옷", "최대 HP +30 · 방어력 +5"], ["3", ICON.ring, "힘의 반지", "공격력 +4 · 방어력 +3"],
  ].map((g, i) => `<label class="pick"><input type="radio" name="sgear" value="${g[0]}"${i === 0 ? " checked" : ""}><span class="gi">${g[1]}<b>${g[2]}</b></span><span class="desc">${g[3]}</span></label>`).join("");
  $("#reward-picks").innerHTML = [
    ["1", ICON.sword, "신성한 파괴검", "공격력 +25"], ["2", ICON.armor, "불멸자의 용비늘 갑옷", "최대 HP +80 · HP 완전 회복 · 방어력 +15"], ["3", ICON.ring, "고대 영웅의 펜던트", "공격력 +12 · 방어력 +10 · 최대 HP +30"],
  ].map((g) => `<button class="pick legend" type="button" data-r="${g[0]}"><span class="gi">${g[1]}<b>${g[2]}</b></span><span class="desc">${g[3]}</span></button>`).join("");
  $("#title-bg").innerHTML = bgHTML(THEMES[0], 3);
  $("#title-dragon").innerHTML = ART.dragon({ body: "#241226", dk: "#0d060f", belly: "#33183a", wing: "#1a0c20", horn: "#4a3550", eye: "#ffb347", rune: false });
  $("#title-cast").innerHTML = ["warrior", "wizard", "healer", "darkwizard", "archmage", "yeon", "hero"].map((k) => `<div>${ART[k]()}</div>`).join("");
}

/* ---------- 이벤트 ---------- */
buildSetup();
show("setup");
$("#btn-start").addEventListener("click", newGame);
$("#btn-next").addEventListener("click", () => { sfx.ui(); if (mode === "story") { turn++; beginTurn(); } else freeNext(); });
$("#btn-leave").addEventListener("click", () => { sfx.ui(); enterHub(`무한의 탑에서 돌아왔습니다. (최고 기록 ${towerBest}층)`); });
$("#btn-hub").addEventListener("click", () => { sfx.ui(); enterHub("12번의 전투를 모두 이겨낸 용사여, 마을에 온 것을 환영합니다!"); });
$("#hub-picks").addEventListener("click", (e) => { const b = e.target.closest("[data-h]"); if (b) hubGo(b.dataset.h); });
$("#shop-picks").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b && !b.disabled) buy(b.dataset.s); });
$("#raid-picks").addEventListener("click", (e) => { const b = e.target.closest("[data-r2]"); if (b) { sfx.ui(); raidId = b.dataset.r2; mode = "raid"; spawn(); } });
$("#btn-shop-back").addEventListener("click", () => { sfx.ui(); backToHub(); });
$("#btn-raid-back").addEventListener("click", () => { sfx.ui(); backToHub(); });
$("#btn-restart").addEventListener("click", () => { sfx.ui(); show("setup"); });
$("#reward-picks").addEventListener("click", (e) => { const b = e.target.closest("[data-r]"); if (b) pickReward(b.dataset.r); });
$("#a-attack").addEventListener("click", () => act("attack"));
$("#a-special").addEventListener("click", () => act("special"));
$("#a-ult").addEventListener("click", () => act("ult"));
$("#a-potion").addEventListener("click", () => act("potion"));
$("#name").addEventListener("keydown", (e) => { if (e.key === "Enter") newGame(); });
$("#btn-mute").addEventListener("click", () => {
  sfx.on = !sfx.on; sfx.unlock();
  $("#btn-mute").textContent = sfx.on ? "🔊 소리" : "🔇 소리"; $("#btn-mute").setAttribute("aria-pressed", String(sfx.on));
});
document.addEventListener("keydown", (e) => {
  if ($("#screen-battle").hidden || e.target.tagName === "INPUT") return;
  const m = { 1: "attack", 2: "special", 3: "ult", 4: "potion" }[e.key];
  if (m) act(m);
});
["attack", "special", "ult", "potion"].forEach((k) => { $("#i-" + k).innerHTML = ICON[k]; });

})();
</script>

</body></html>
